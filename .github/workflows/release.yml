name: Release

# Runs when a version tag is pushed: by the owner, or by the coordinating agent the owner
# authorised on 2026-10-27 to cut releases once every PR has landed and CI is green on main.
# - vMAJOR.MINOR.PATCH: a version the owner declared stable.
# - vMAJOR.MINOR.PATCH-alpha.N, -beta.N or -rc.N: a pre-release, marked as such on GitHub.
# MAJOR.MINOR.PATCH must equal the workspace version in Cargo.toml. The release is created as a
# draft to review and publish. Its notes start with docs/releases/<tag>.md when that
# file exists, followed by GitHub's generated list of changes.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag matches the workspace version and is on main
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-(alpha|beta|rc)\.[0-9]+)?$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-alpha|beta|rc.N"; exit 1; }
          test "${BASH_REMATCH[1]}" = "$version" || { echo "tag $GITHUB_REF_NAME does not match workspace version $version"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main"; exit 1; }

  test:
    needs: check
    uses: ./.github/workflows/rust.yml

  build:
    needs: test
    uses: ./.github/workflows/build-executables.yml
    with:
      version: ${{ github.ref_name }}
      retention-days: 7

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v4
        with:
          # Only the packages; the test job's compat-report is not a download for users.
          pattern: openstitch-*
          path: assets
          merge-multiple: true
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # WiX debug symbols are a build by-product, not something users download.
          rm -f assets/*.wixpdb
          # SHA-256 of every asset (sha256sum format). The editor's updater downloads this file
          # first and refuses an asset whose digest is missing or different
          # (docs/research/updater.md).
          (cd assets && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS assets/
          cat assets/SHA256SUMS
          args=(--repo "$GITHUB_REPOSITORY" --draft --verify-tag
                --title "OpenStitch $GITHUB_REF_NAME" --generate-notes)
          case "$GITHUB_REF_NAME" in *-*) args+=(--prerelease) ;; esac
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); fi
          gh release create "$GITHUB_REF_NAME" assets/* "${args[@]}"
