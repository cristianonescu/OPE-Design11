name: Release

# Runs only when the owner pushes a version tag (vMAJOR.MINOR.PATCH) for a version declared
# stable. Agents never create tags. The release is created as a draft for the owner to review
# and publish.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag matches the workspace version and is on main
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != workspace version v$version"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main"; exit 1; }

  test:
    needs: check
    uses: ./.github/workflows/rust.yml

  build:
    needs: test
    uses: ./.github/workflows/build-executables.yml
    with:
      version: ${{ github.ref_name }}
      retention-days: 7

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "OpenStitch $GITHUB_REF_NAME" --generate-notes
