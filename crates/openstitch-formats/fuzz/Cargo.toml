[package]
name = "openstitch-formats-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
openstitch-formats = { path = ".." }

# Kept out of the root workspace (see its `exclude`): cargo-fuzz needs nightly and sanitizers.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "read_pes"
path = "fuzz_targets/read_pes.rs"
test = false
doc = false
bench = false

