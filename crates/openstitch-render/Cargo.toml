[package]
name = "openstitch-render"
description = "Pure-Rust rendering of OpenStitch designs: previews, file-manager thumbnails"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "openstitch-thumbnailer"
path = "src/bin/openstitch-thumbnailer.rs"

[dependencies]
openstitch-core.workspace = true
openstitch-design = { path = "../openstitch-design" }
openstitch-engine = { path = "../openstitch-engine", default-features = false }
openstitch-formats = { path = "../openstitch-formats" }
png = "0.18.1"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }

[lints]
workspace = true
