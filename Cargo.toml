[workspace]
resolver = "3"
# Explicit list: a crate joins once its manifest builds, so parallel work never breaks the workspace.
members = [
    "crates/openstitch-core",
    "crates/openstitch-design",
    "crates/openstitch-formats",
    "crates/openstitch-engine",
    "crates/stitchtool",
    "crates/openstitch-mcp",
    "crates/openstitch-app",
    "crates/openstitch-digitize",
    "crates/openstitch-render",
    "crates/openstitch-print",
    "crates/openstitch-library",
    "crates/openstitch-remote",
]
exclude = ["crates/openstitch-formats/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cristianonescu/OPE-Design11"
rust-version = "1.85"

[workspace.dependencies]
openstitch-core = { path = "crates/openstitch-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
