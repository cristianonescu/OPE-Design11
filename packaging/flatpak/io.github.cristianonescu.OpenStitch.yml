# Flatpak manifest for the OpenStitch editor.
#   flatpak-builder --user --install-deps-from=flathub --force-clean \
#     build-flatpak packaging/flatpak/io.github.cristianonescu.OpenStitch.yml
# Cargo fetches crates during the build (build-args: --share=network), which flatpak-builder
# allows for local builds; a Flathub submission needs the crates listed as offline sources
# instead (flatpak-cargo-generator, see docs/DISTRIBUTION.md).
id: io.github.cristianonescu.OpenStitch
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: openstitch
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Designs, fonts and machine files live anywhere in the home folder and on USB sticks;
  # File ▸ Open also goes through the desktop portal.
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/openstitch/cargo
modules:
  - name: openstitch
    buildsystem: simple
    build-commands:
      - cargo build --release --locked -p openstitch-app
      - install -Dm755 target/release/openstitch /app/bin/openstitch
      # Exported files must carry the application id.
      - >-
        sed 's/^Icon=openstitch$/Icon=io.github.cristianonescu.OpenStitch/' packaging/linux/openstitch.desktop
        > io.github.cristianonescu.OpenStitch.desktop
      - install -Dm644 io.github.cristianonescu.OpenStitch.desktop -t /app/share/applications
      - >-
        sed 's/<icon name="openstitch"\/>/<icon name="io.github.cristianonescu.OpenStitch"\/>/' packaging/linux/openstitch-mime.xml
        > io.github.cristianonescu.OpenStitch.xml
      - install -Dm644 io.github.cristianonescu.OpenStitch.xml -t /app/share/mime/packages
      - install -Dm644 packaging/flatpak/io.github.cristianonescu.OpenStitch.metainfo.xml -t /app/share/metainfo
      - >-
        for s in 16 32 48 64 128 256 512; do
        install -Dm644 assets/icons/openstitch-$s.png /app/share/icons/hicolor/${s}x$s/apps/io.github.cristianonescu.OpenStitch.png;
        done
      - install -Dm644 assets/icons/openstitch.svg /app/share/icons/hicolor/scalable/apps/io.github.cristianonescu.OpenStitch.svg
      - install -Dm644 LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md -t /app/share/licenses/io.github.cristianonescu.OpenStitch
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - .git
          - .flatpak-builder
          - build-flatpak
          - repo
